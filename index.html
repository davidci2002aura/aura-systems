<!doctype html>
<html lang="de" style="background:#f5f5f7">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        const saved = localStorage.getItem('aura-theme');
        const dark = saved === 'dark';
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.style.background = dark ? '#0d0d0f' : '#f5f5f7';
      })();
    </script>

    <!-- Primary Meta Tags -->
    <title>Aura Systems | Websites &amp; Automatisierung aus Ravensburg</title>
    <meta name="title" content="Aura Systems | Websites &amp; Automatisierung aus Ravensburg" />
    <meta
      name="description"
      content="Klare Websites und kleine Automatisierungen für lokale Unternehmen. Persönlich umgesetzt in Ravensburg."
    />
    <meta name="keywords" content="Web Development, Neural Architecture, Premium Web Solutions, React, TypeScript, Web Design, Digital Solutions" />
    <meta name="author" content="AURA Neural Architecture" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://aura-systems.vercel.app/" />
    <meta property="og:title" content="AURA | Neural Architecture - Premium Web Solutions" />
    <meta property="og:description" content="Premium Web Solutions für ambitionierte Unternehmen. Atmosphärisch. Präzise. Skalierbar." />
    <meta property="og:image" content="https://aura-systems.vercel.app/og-image.jpg" />
    <meta property="og:locale" content="de_DE" />
    <meta property="og:site_name" content="AURA Neural Architecture" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://aura-systems.vercel.app/" />
    <meta property="twitter:title" content="AURA | Neural Architecture - Premium Web Solutions" />
    <meta property="twitter:description" content="Premium Web Solutions für ambitionierte Unternehmen. Atmosphärisch. Präzise. Skalierbar." />
    <meta property="twitter:image" content="https://aura-systems.vercel.app/og-image.jpg" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#f5f5f7" />
    <meta name="msapplication-TileColor" content="#f5f5f7" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- Preconnect to external domains -->
    <link rel="dns-prefetch" href="https://hook.eu2.make.com" />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "AURA Neural Architecture",
      "description": "Premium Web Solutions für ambitionierte Unternehmen",
      "url": "https://aura-systems.vercel.app/",
      "logo": "https://aura-systems.vercel.app/favicon.svg",
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "Customer Service",
        "availableLanguage": ["German", "English"]
      },
      "sameAs": []
    }
    </script>
  </head>
  <body style="background:#f5f5f7">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
